on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

permissions:
  contents: read

jobs:
  coverage:
    # The shared workflow declares read-all, and a called workflow cannot
    # exceed the permissions of the job that calls it.
    permissions: read-all
    uses: CTTIR/.github/.github/workflows/test-coverage.yaml@7781930dce57f5d8ac05a7803fb42fe3b591d354
    with:
      floor: 95
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
