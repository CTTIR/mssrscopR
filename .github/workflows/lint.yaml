on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: lint

permissions:
  contents: read

jobs:
  lint:
    # The shared workflow declares read-all, and a called workflow cannot
    # exceed the permissions of the job that calls it.
    permissions: read-all
    uses: CTTIR/.github/.github/workflows/lint.yaml@7781930dce57f5d8ac05a7803fb42fe3b591d354
    with:
      blocking: true
      with-defaults: false

  repository-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          use-public-rspm: true
          extra-repositories: https://cttir.r-universe.dev
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          extra-packages: any::lintr, any::pkgload, local::.
          needs: lint
      - name: Enforce the repository lint configuration
        shell: Rscript {0}
        run: |
          pkgload::load_all(".", quiet = TRUE)
          findings <- lintr::lint_package()
          print(findings)
          stopifnot(length(findings) == 0L)
