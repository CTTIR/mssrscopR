on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: lint

permissions: read-all

jobs:
  lint:
    uses: CTTIR/.github/.github/workflows/lint.yaml@main
    with:
      blocking: true
      with-defaults: false

  repository-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          extra-repositories: https://cttir.r-universe.dev
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, any::pkgload, local::.
          needs: lint
      - name: Enforce the repository lint configuration
        shell: Rscript {0}
        run: |
          pkgload::load_all(".", quiet = TRUE)
          findings <- lintr::lint_package()
          print(findings)
          stopifnot(length(findings) == 0L)
