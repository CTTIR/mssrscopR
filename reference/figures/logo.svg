<svg width="500" height="580" viewBox="0 0 500 580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgmss" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0%"  stop-color="#0e2038"/>
      <stop offset="100%" stop-color="#060e1c"/>
    </linearGradient>
    <!-- Gaussian blur for the low-res pixel pair -->
    <filter id="blurLR" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6.5"/>
    </filter>
    <filter id="blurSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <!-- resolved-point glow -->
    <radialGradient id="hrGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#8FC4FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8FC4FF" stop-opacity="0"/>
    </radialGradient>
    <!-- mean-shift kernel field -->
    <radialGradient id="kernel" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#3B82F6" stop-opacity="0.30"/>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>
    <!-- sweep arrow gradient -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#2E6FC9" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#7FB4FF" stop-opacity="0.95"/>
    </linearGradient>
    <clipPath id="hexmss">
      <polygon points="250,30 455,145 455,375 250,490 45,375 45,145"/>
    </clipPath>
  </defs>

  <polygon points="250,30 455,145 455,375 250,490 45,375 45,145" fill="url(#bgmss)"/>

  <g clip-path="url(#hexmss)">

    <!-- faint pixel grid -->
    <g stroke="#17365c" stroke-width="0.5" opacity="0.5">
      <line x1="45" y1="190" x2="455" y2="190"/>
      <line x1="45" y1="228" x2="455" y2="228"/>
      <line x1="45" y1="266" x2="455" y2="266"/>
      <line x1="45" y1="304" x2="455" y2="304"/>
      <line x1="130" y1="150" x2="130" y2="340"/>
      <line x1="168" y1="150" x2="168" y2="340"/>
      <line x1="206" y1="150" x2="206" y2="340"/>
      <line x1="294" y1="150" x2="294" y2="340"/>
      <line x1="332" y1="150" x2="332" y2="340"/>
      <line x1="370" y1="150" x2="370" y2="340"/>
    </g>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- LEFT: low-resolution, blurred pixel pair                  -->
    <!-- two overlapping blobs that cannot be told apart           -->
    <!-- ══════════════════════════════════════════════════════ -->
    <g filter="url(#blurLR)">
      <ellipse cx="150" cy="247" rx="26" ry="24" fill="#2E6FC9" opacity="0.85"/>
      <ellipse cx="178" cy="247" rx="26" ry="24" fill="#2E6FC9" opacity="0.85"/>
    </g>
    <!-- coarse LR pixel cell outlines over the blur -->
    <g fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.28">
      <rect x="130" y="228" width="38" height="38"/>
      <rect x="168" y="228" width="38" height="38"/>
    </g>
    <text font-family="monospace" font-size="8" fill="#5E86B8" opacity="0.75"
      text-anchor="middle" x="164" y="300">low-res</text>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- MIDDLE: mean-shift sweep — kernel climbing the density     -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- kernel field -->
    <circle cx="250" cy="247" r="40" fill="url(#kernel)"/>
    <!-- mean-shift trajectory: short converging steps (dotted, with kernel rings) -->
    <g fill="none" stroke="#7FB4FF" stroke-linecap="round">
      <circle cx="232" cy="256" r="15" stroke-width="1" opacity="0.25"/>
      <circle cx="244" cy="250" r="12" stroke-width="1" opacity="0.35"/>
      <circle cx="254" cy="246" r="9"  stroke-width="1.2" opacity="0.5"/>
    </g>
    <!-- shift vectors (the mode-seeking steps) -->
    <g stroke="#9CC6FF" stroke-width="1.6" opacity="0.85" stroke-linecap="round" fill="none">
      <path d="M 230,258 L 242,251"/>
      <path d="M 244,250 L 253,246"/>
    </g>
    <g fill="#CFE4FF">
      <circle cx="230" cy="258" r="1.8"/>
      <circle cx="242" cy="251" r="1.8"/>
      <circle cx="254" cy="246" r="2.4"/>
    </g>
    <!-- big flow arrow LR -> HR -->
    <path d="M 196,335 L 300,335" stroke="url(#sweep)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <polygon points="300,329 314,335 300,341" fill="#7FB4FF"/>
    <text font-family="monospace" font-size="7.5" fill="#7FB4FF" opacity="0.9"
      text-anchor="middle" x="250" y="328">mean shift</text>

    <!-- ══════════════════════════════════════════════════════ -->
    <!-- RIGHT: resolved high-resolution pixel pair                -->
    <!-- two crisp, clearly-separated bright points                -->
    <!-- ══════════════════════════════════════════════════════ -->
    <!-- fine HR pixel sub-grid -->
    <g fill="none" stroke="#3B82F6" stroke-width="0.6" opacity="0.4">
      <rect x="320" y="228" width="19" height="19"/>
      <rect x="339" y="228" width="19" height="19"/>
      <rect x="358" y="228" width="19" height="19"/>
      <rect x="320" y="247" width="19" height="19"/>
      <rect x="339" y="247" width="19" height="19"/>
      <rect x="358" y="247" width="19" height="19"/>
    </g>
    <!-- two resolved points -->
    <circle cx="334" cy="243" r="16" fill="url(#hrGlow)"/>
    <circle cx="364" cy="251" r="16" fill="url(#hrGlow)"/>
    <circle cx="334" cy="243" r="5.5" fill="#EAF3FF" stroke="#8FC4FF" stroke-width="1.5"/>
    <circle cx="364" cy="251" r="5.5" fill="#EAF3FF" stroke="#8FC4FF" stroke-width="1.5"/>
    <!-- resolution separation tick between them -->
    <g stroke="#9FE8C0" stroke-width="1.1" opacity="0.8">
      <line x1="334" y1="266" x2="364" y2="266"/>
      <line x1="334" y1="263" x2="334" y2="269"/>
      <line x1="364" y1="263" x2="364" y2="269"/>
    </g>
    <text font-family="monospace" font-size="7.5" fill="#9FE8C0" opacity="0.85"
      text-anchor="middle" x="349" y="280">resolved</text>
    <text font-family="monospace" font-size="8" fill="#8FC4FF" opacity="0.8"
      text-anchor="middle" x="349" y="300">super-res</text>

    <!-- resolution profile curves below: blurred hump -> twin peaks -->
    <path d="M 108,392 C 132,392 140,364 164,364 C 188,364 196,392 220,392"
      fill="none" stroke="#5E86B8" stroke-width="1.6" opacity="0.55"/>
    <path d="M 300,392 C 316,392 322,368 334,368 C 344,368 348,386 349,386
             C 350,386 354,368 364,368 C 376,368 382,392 398,392"
      fill="none" stroke="#8FC4FF" stroke-width="1.8" opacity="0.9"/>

    <!-- annotation -->
    <text font-family="monospace" font-size="8" fill="#5E86B8" opacity="0.6"
      text-anchor="middle" x="250" y="418">mean-shift super-resolution</text>

  </g>

  <!-- Hex border — imaging group blue -->
  <polygon points="250,30 455,145 455,375 250,490 45,375 45,145"
    fill="none" stroke="#185FA5" stroke-width="11" stroke-linejoin="round"/>
  <polygon points="250,44 441,153 441,367 250,476 59,367 59,153"
    fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-linejoin="round" opacity="0.55"/>

  <!-- Package name -->
  <text font-family="monospace" font-weight="700" font-size="25"
    fill="#8FC4FF" text-anchor="middle" x="250" y="545" letter-spacing="1">mssrscopR</text>
</svg>
